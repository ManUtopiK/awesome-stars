name: update awesome-stars
on:
  workflow_dispatch:
  schedule:
  - cron: 30 0 * * *
permissions:
  contents: write
jobs:
  awesome-stars:
    name: update awesome-stars
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: generate README.md, topics.md and stars.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        STARS_USER: ${{ github.repository_owner }}
      run: python scripts/update_stars.py
    - name: commit changes
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add README.md topics.md stars.json
        git diff --cached --quiet || { git commit -m 'awesome-stars update by github actions cron'; git push; }
